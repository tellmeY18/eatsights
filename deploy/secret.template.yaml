# TEMPLATE ONLY. Copy outside the repo, fill in, apply out of band. Never commit real values.
#   cp deploy/secret.template.yaml ~/eatsights-secrets.yaml && $EDITOR ~/eatsights-secrets.yaml
#   kubectl apply -f ~/eatsights-secrets.yaml
# Or create them with `kubectl create secret generic ... --from-literal` / sealed-secrets /
# external-secrets: only the names and keys below matter.
---
# Mounted by the app Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: eatsights
  namespace: eatsights
type: Opaque
stringData:
  # Login in eatsights_write + eatsights_worker (deploy/README.md, "Database roles").
  DATABASE_URL: "postgres://eatsights_app:CHANGE_ME@postgres.example:5432/eatsights?sslmode=require"
  # Login in eatsights_read only. Optional; defaults to DATABASE_URL.
  DATABASE_READ_URL: "postgres://eatsights_ro:CHANGE_ME@postgres.example:5432/eatsights?sslmode=require"
  # At least 32 random bytes: head -c 32 /dev/urandom | base64. Never change it casually:
  # a new salt needs EATSIGHTS_PSEUDONYM_SALT_VERSION + 1 (ADR-0006 #3).
  EATSIGHTS_PSEUDONYM_SALT: "CHANGE_ME"
  # root.public from scripts/trust-bootstrap.sh (public, but kept with the rest for convenience).
  EATSIGHTS_ROOT_PUBLIC_KEY: "CHANGE_ME_43_chars"
---
# Mounted ONLY by the migrate Job. Schema owner: DDL, extensions, group roles.
apiVersion: v1
kind: Secret
metadata:
  name: eatsights-migrate
  namespace: eatsights
type: Opaque
stringData:
  DATABASE_URL: "postgres://eatsights_owner:CHANGE_ME@postgres.example:5432/eatsights?sslmode=require"
