# Run once per release before rolling the Deployment. Delete the old Job first.
apiVersion: batch/v1
kind: Job
metadata:
  name: eatsights-migrate
  namespace: eatsights
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/letsimpl/eatsights:latest
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: eatsights }
            - secretRef: { name: eatsights }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
