apiVersion: v1
kind: ConfigMap
metadata:
  name: eatsights
  namespace: eatsights
data:
  EATSIGHTS_LISTEN: "0.0.0.0:8080"
  EATSIGHTS_BASE_URL: "https://eatsights.letsimpl.fyi"
  EATSIGHTS_DB_POOL: "8"
  EATSIGHTS_PSEUDONYM_SALT_VERSION: "1"
  TOKIO_WORKER_THREADS: "1"
  RUST_LOG: "info"
  EATSIGHTS_ROLES: "api,worker"
  # Comma-separated CIDRs of proxies whose X-Forwarded-For is trusted (ingress pods).
  EATSIGHTS_TRUSTED_PROXIES: "10.0.0.0/8"
  EATSIGHTS_RATE_PER_KEY_PER_MIN: "120"
  EATSIGHTS_RATE_PER_IP_PER_MIN: "600"
  EATSIGHTS_KEYREG_PER_IP_PER_HOUR: "30"
  EATSIGHTS_MAX_OBSERVATION_AGE_DAYS: "30"
  EATSIGHTS_TRUST_MAX_DEPTH: "4"            # ADR-0006/0007
  EATSIGHTS_VENDOR_OF_MAX_DAYS: "365"
  EATSIGHTS_TRUST_STRIKES: "2"
  EATSIGHTS_TRUST_STRIKE_WINDOW_DAYS: "180"
  EATSIGHTS_TRUST_VOUCH_COOLDOWN_DAYS: "30"
  EATSIGHTS_CACHE_MB: "64"
  EATSIGHTS_REQUEST_TIMEOUT_SECS: "10"
  EATSIGHTS_WORKER_INTERVAL_SECS: "30"
  EATSIGHTS_SWAGGER_UI: "false"  # ADR-0005
