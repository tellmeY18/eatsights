apiVersion: apps/v1
kind: Deployment
metadata:
  name: eatsights
  namespace: eatsights
spec:
  replicas: 1
  selector:
    matchLabels: { app: eatsights }
  template:
    metadata:
      labels: { app: eatsights }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: eatsights
          image: ghcr.io/letsimpl/eatsights:latest
          args: ["serve", "--roles", "api,worker"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: eatsights }
            - secretRef: { name: eatsights }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
