# Adjust ingressClassName and the TLS annotations to your cluster (deploy/README.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eatsights
  namespace: eatsights
  annotations:
    # cert-manager: issues the eatsights-tls certificate. Remove if TLS ends at a CDN/LB.
    cert-manager.io/cluster-issuer: letsencrypt
    # ingress-nginx: bodies are capped by the app too (EATSIGHTS_BODY_LIMIT_BYTES, 1 MiB).
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: eatsights.letsimpl.fyi
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eatsights
                port: { name: http }
  tls:
    - hosts: [eatsights.letsimpl.fyi]
      secretName: eatsights-tls
