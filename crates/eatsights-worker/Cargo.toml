[package]
name = "eatsights-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
eatsights-core = { path = "../eatsights-core" }
eatsights-db = { path = "../eatsights-db" }
tokio = { version = "1", features = ["time", "sync", "macros"] }
tracing = "0.1"
flate2 = "1"
sha2 = "0.10"
thiserror = "2"
# OSM checker HTTP client (rustls + ring, already in the tree via sqlx; no OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }
