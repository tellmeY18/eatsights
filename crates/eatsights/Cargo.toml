[package]
name = "eatsights"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eatsights-core = { path = "../eatsights-core" }
eatsights-db = { path = "../eatsights-db" }
eatsights-api = { path = "../eatsights-api" }
eatsights-worker = { path = "../eatsights-worker" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
poem = "3"
